{% extends "base.html" %}
{% block title %}Kurstypen verwalten{% endblock %}
{% block content %}
<div class="page-head"><h1>Kurstypen verwalten</h1></div>

<div class="card">
  <h2>Neuen Kurstyp anlegen</h2>
  <form method="post" class="inline-form">
    <input type="hidden" name="aktion" value="neu">
    <label>Name <input type="text" name="name" required></label>
    <button class="btn btn-primary" type="submit">Anlegen</button>
  </form>
</div>

<div class="card">
  <h2>Kurstypen ({{ kurse|length }})</h2>
  <table class="data">
    <thead><tr><th>Name</th><th></th></tr></thead>
    <tbody>
      {% for k in kurse %}
      <tr>
        <td>{{ k.name }}</td>
        <td class="row-actions">
          <details>
            <summary class="btn btn-small">Bearbeiten</summary>
            <form method="post" class="inline-form edit-form">
              <input type="hidden" name="aktion" value="bearbeiten">
              <input type="hidden" name="id" value="{{ k.id }}">
              <label>Name <input type="text" name="name" value="{{ k.name }}" required></label>
              <button class="btn btn-primary btn-small" type="submit">Speichern</button>
            </form>
          </details>
          <form method="post" onsubmit="return confirm('Kurstyp wirklich löschen?');" style="display:inline">
            <input type="hidden" name="aktion" value="loeschen">
            <input type="hidden" name="id" value="{{ k.id }}">
            <button class="btn btn-small btn-danger" type="submit">Löschen</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
